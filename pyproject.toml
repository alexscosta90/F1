[project]
name = "f1"
version = "0.1.0"
description = "Pipeline local para dados históricos da API OpenF1"
authors = [{ name = "alexscosta90", email = "lex_agnusdei@hotmail.com" }]
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas>=2.2,<3.0",
    "plotly>=5.24,<7.0",
    "streamlit>=1.57,<2.0",
]

[tool.poetry]
packages = [{ include = "f1", from = "src" }]

[tool.poetry.group.dev.dependencies]
ruff = ">=0.11,<1.0"
taskipy = "^1.14.1"

[tool.poetry.group.test.dependencies]
pytest = ">=8.0,<9.0"
pytest-cov = ">=6.0,<7.0"

[tool.poetry.group.docs.dependencies]
mkdocs = ">=1.6,<2.0"
mkdocs-material = ">=9.5,<10.0"

[project.scripts]
f1 = "f1.cli:main"
dashboard = "f1.dashboard:launch"

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C4", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
branch = true
source = ["f1"]
# Streamlit executes its page script in an isolated runner; AppTest covers it separately.
omit = ["*/__init__.py", "*/dashboard.py"]

[tool.coverage.report]
show_missing = true
fail_under = 50

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.taskipy.tasks]
format = "ruff format ."
lint = "ruff check ."
test = "pytest"
docs = "mkdocs build --strict"